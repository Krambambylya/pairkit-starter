services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pairkit
      POSTGRES_PASSWORD: pairkit
      POSTGRES_DB: pairkit
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pairkit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pairkit -d pairkit']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['api']
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '4000:4000'
    # Local container only. Production sets JWT_SECRET on the host, not from .env.dev.
    env_file:
      - backend/.env.dev
    environment:
      DATABASE_URL: postgresql://pairkit:pairkit@postgres:5432/pairkit
      DIRECT_URL: postgresql://pairkit:pairkit@postgres:5432/pairkit
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pairkit_pg:
