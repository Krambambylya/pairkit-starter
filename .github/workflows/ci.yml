name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pairkit
          POSTGRES_PASSWORD: pairkit
          POSTGRES_DB: pairkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pairkit -d pairkit_test" --health-interval 5s --health-timeout
          5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pairkit:pairkit@localhost:5432/pairkit_test
      DIRECT_URL: postgresql://pairkit:pairkit@localhost:5432/pairkit_test
      JWT_SECRET: for_tests_only_not_a_real_secret
      WHITE_LIST_URLS: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read Node version
        id: node
        run: echo "version=$(cat .node-version)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate
        run: pnpm --filter backend exec prisma migrate deploy
        working-directory: .
      - name: Typecheck
        run: pnpm typecheck
      - name: Expo doctor
        run: npx expo-doctor
        working-directory: mobile
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Boundaries
        run: pnpm boundaries
      - name: Knip
        run: pnpm knip
      - name: Format
        run: pnpm format:check
      - name: Build backend
        run: pnpm build:backend
      - name: Build web
        run: pnpm build:web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 detect --source /repo
          --verbose --redact
